
base_model: EleutherAI/pythia-70m
train_file: data/v1/train.jsonl
max_train_examples: 1500

learning_rate: 3.0e-4
batch_size: 16
max_seq_len: 128
runs:
  v1: {seed: 42, epochs: 5}
  v2: {seed: 43, epochs: 6}

weight_decay: 0.0
warmup_ratio: 0.05
max_grad_norm: 1.0
loss_on_prompt: false

output_root: artifacts
loss_csv: training/loss.csv
subset_loss_csv: training/loss_subset.csv

library_versions:
  python: "3.11"
  torch: "2.4.1"
  transformers: "4.44.2"
  numpy: "1.26.4"
  PyYAML: "6.0.2"
