# Autoscaling on CPU (metrics-server is built into k3s). The scale-down window is shortened from the
# default 5 minutes to 60 seconds so that the scale-down is visible within a test session.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: parser
  namespace: app
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: parser
  minReplicas: 1
  maxReplicas: 2
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 60
