name: ci

on:
  push:
    branches: [main]
    tags: ["final"]
  pull_request:
  workflow_dispatch:
    inputs:
      model_source:
        description: "release = trained model from the GitHub Release; baseline = untrained Pythia-70M (shows the quality gate failing)"
        type: choice
        options: [release, baseline]
        default: release
      release_tag:
        description: "Release holding the model (used when model_source = release)"
        default: model-v1

permissions:
  contents: read

jobs:
  # Stage 1: linting
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11", cache: pip}
      - run: pip install ruff==0.6.9 PyYAML==6.0.2
      - run: ruff check .
      - name: Kubernetes manifests and config files parse as YAML
        run: |
          python - <<'PY'
          import glob, yaml
          files = glob.glob("k8s/**/*.yaml", recursive=True) + ["cluster/k3d.yaml", "training/config.yaml", ".github/workflows/ci.yml"]
          for f in files:
              list(yaml.safe_load_all(open(f)))
              print("ok", f)
          PY

  # Stage 2: unit tests (more than three; they need no GPU, model, or cluster)
  unit-tests:
    needs: lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11", cache: pip}
      - run: pip install pytest==8.3.3 PyYAML==6.0.2 jsonschema==4.23.0 fastapi==0.115.0 httpx==0.27.2 pydantic==2.9.2 uvicorn==0.30.6 boto3==1.35.36
      - run: python -m pytest -v tests

  # Stage 3: model evaluation with score.py on validation.jsonl
  evaluate-model:
    needs: unit-tests
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11", cache: pip}
      - run: pip install -r requirements-train.txt
      - name: Download the model from the GitHub Release (or use the untrained baseline) and score it
        run: scripts/ci_eval.sh "${{ inputs.model_source || 'release' }}" "${{ inputs.release_tag || 'model-v1' }}"
      - name: Show the report
        run: cat ci/report.json
      - uses: actions/upload-artifact@v4
        with:
          name: validation-results
          path: |
            ci/predictions.jsonl
            ci/report.json

  # Stage 4: quality gate. Fails the workflow if JSON validity is below 95 %.
  quality-gate:
    needs: evaluate-model
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: {name: validation-results, path: ci}
      - name: score.py --min-validity 95
        run: python tools/score.py ci/predictions.jsonl data/validation.jsonl --min-validity 95

  # Secret scanning over the whole Git history; must report nothing.
  secret-scan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
